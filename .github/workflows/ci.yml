name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 离线测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法编译
        run: python -m py_compile decision.py mcp_server.py examples/quickstart.py

      - name: 注册表装载自检
        run: python decision.py list

      - name: 离线单元测试（不需要 API key、不联网）
        run: python -m unittest discover -s tests -v

      - name: 注册表逐份 schema 校验
        run: python -c "import decision,sys; [decision.load_decision(n) for n in decision.list_decisions()]; print('registries OK')"
